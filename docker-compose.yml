# Fixed project name: containers, networks and volumes are prefixed "cyberhelpasia-trust-",
# so they never collide with other Docker sites on the same VPS.
name: cyberhelpasia-trust

services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: trust
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: trust
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U trust"]
      interval: 5s
      retries: 10
    # No ports published: the database is reachable only from this project's network.

  # One-off: applies migrations and seeds the control library, then exits.
  migrate:
    build: { context: ., target: build }
    command: npm run db:setup
    environment:
      DATABASE_URL: postgres://trust:${POSTGRES_PASSWORD}@db:5432/trust
    depends_on:
      db: { condition: service_healthy }
    restart: "no"

  app:
    build: { context: ., target: runtime }
    restart: unless-stopped
    environment:
      DATABASE_URL: postgres://trust:${POSTGRES_PASSWORD}@db:5432/trust
      SESSION_SECRET: ${SESSION_SECRET:?set SESSION_SECRET in .env}
      MFA_ENC_KEY: ${MFA_ENC_KEY:?set MFA_ENC_KEY in .env}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      ANTHROPIC_MODEL: ${ANTHROPIC_MODEL:-claude-sonnet-5-5}
      UPLOAD_DIR: /app/uploads
    volumes:
      - uploads:/app/uploads
    # Loopback only. APP_PORT defaults to 3010 so it does not clash with other apps on 3000.
    ports:
      - "127.0.0.1:${APP_PORT:-3010}:3000"
    depends_on:
      migrate: { condition: service_completed_successfully }
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1:3000/login || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5

volumes:
  pgdata:
  uploads:
